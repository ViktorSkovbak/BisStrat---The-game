<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Kingman Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../kit/lab.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<script type="module">
import { createLab, fmt } from "../kit/lab.js";

/* ---------- The model: Kingman (1 server) and Sakasegawa (c servers), in working days ---------- */
const JOB = 2; // average job takes 2 working days

function busy(p) { return (p.jobs * JOB) / (p.engineers * p.days); }

function model(p) {
  const u = busy(p);
  const V = (p.ca * p.ca + p.cs * p.cs) / 2;
  let waitJobs; // queue wait in job-times
  if (u >= 0.995) waitJobs = Infinity;
  else if (p.shared) waitJobs = V * Math.pow(u, Math.sqrt(2 * (p.engineers + 1)) - 1) / (p.engineers * (1 - u));
  else waitJobs = V * u / (1 - u); // separate queues: each engineer is a one-person floor
  const wait = waitJobs * JOB;
  const lead = wait + JOB;
  const wip = Number.isFinite(lead) ? (p.jobs / p.days) * lead : Infinity; // Little's law
  const slack = Math.max(0, p.engineers * p.days * (1 - u));
  const caption = !Number.isFinite(wait)
    ? `Overloaded: work arrives faster than ${p.engineers} engineers can finish it. The queue grows without limit.`
    : `Team ${Math.round(u * 100)}% busy: a 2-day job waits ${fmt(wait)} working days before anyone starts it, so customers wait ${fmt(lead)} days.`;
  return { values: { busy: u * 100, wait, lead, wip, slack }, caption };
}

/* ---------- Monte Carlo check of the formula, in a worker (off the main thread) ---------- */
const workerSrc = `
function gamma(mean, cv, rnd) { if (cv <= 0.001) return mean; const k = 1 / (cv * cv); return shape(k, rnd) * mean / k; }
function shape(k, rnd) { if (k < 1) return shape(k + 1, rnd) * Math.pow(rnd(), 1 / k);
  const d = k - 1 / 3, c = 1 / Math.sqrt(9 * d);
  for (;;) { let x, v; do { const a = 1 - rnd(), b = rnd(); x = Math.sqrt(-2 * Math.log(a)) * Math.cos(2 * Math.PI * b); v = 1 + c * x; } while (v <= 0);
    v = v * v * v; const u = rnd(); if (u < 1 - 0.0331 * x ** 4 || Math.log(u) < 0.5 * x * x + d * (1 - v + Math.log(v))) return d * v; } }
function rng(seed) { return function () { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function wait(u, c, ca, cs, jobs, seed) { const r = rng(seed), gap = 1 / (u * c), free = new Array(c).fill(0);
  let t = 0, sum = 0, n = 0; const warm = Math.floor(jobs * 0.1);
  for (let i = 0; i < jobs; i++) { t += gamma(gap, ca, r); let k = 0; for (let j = 1; j < c; j++) if (free[j] < free[k]) k = j;
    const s = Math.max(t, free[k]); free[k] = s + gamma(1, cs, r); if (i >= warm) { sum += s - t; n++; } } return sum / n; }
onmessage = (e) => { const { id, u, c, ca, cs } = e.data; postMessage({ id, u, w: wait(u, c, ca, cs, u >= 0.95 ? 180000 : 60000, 999 + Math.round(u * 1000)) }); };`;
const worker = new Worker(URL.createObjectURL(new Blob([workerSrc], { type: "text/javascript" })));
const GRID = [0.5, 0.6, 0.7, 0.75, 0.8, 0.85, 0.9, 0.93, 0.95, 0.97];
let measured = new Map(), measuredKey = "", runId = 0;
function measure(p) {
  const key = `${p.shared ? p.engineers : 1}|${p.ca}|${p.cs}`;
  if (key === measuredKey) return;
  measuredKey = key; measured = new Map(); runId++;
  GRID.forEach((u) => worker.postMessage({ id: runId, u, c: p.shared ? p.engineers : 1, ca: p.ca, cs: p.cs }));
}
worker.onmessage = (e) => { if (e.data.id === runId) { measured.set(e.data.u, e.data.w * JOB); lab.refresh(); } };

/* ---------- The floor: crates are jobs, glowing lights are engineers ---------- */
function scene(k) {
  const { THREE, box, sphere, mats, glow, remove } = k;
  box(6, 0.3, 1.4, mats.belt, -13, 0, 0);
  box(9, 0.3, 1.4, mats.belt, 11.5, 0, 0);
  const crateGeo = new THREE.BoxGeometry(0.7, 0.55, 0.7);
  let stations = [], crates = new Set(), yard = null, sim = null, shape = "", P = null;
  const rate = (p) => p.jobs / p.days; // jobs per working day

  // Gamma-like draw with the right mean and roughly the right spread; good enough to watch.
  function draw(mean, cv) {
    if (cv <= 0.001) return mean;
    const n = Math.max(1, Math.round(1 / (cv * cv)));
    let s = 0;
    for (let i = 0; i < n; i++) s += -Math.log(1 - Math.random());
    return (s / n) * mean;
  }
  function build(p) {
    stations.forEach((s) => { remove(s.desk); remove(s.light); });
    crates.forEach((c) => remove(c.mesh)); crates.clear();
    if (yard) remove(yard);
    stations = [];
    const n = p.engineers, gap = Math.min(1.9, 14 / n);
    for (let i = 0; i < n; i++) {
      const z = (i - (n - 1) / 2) * gap;
      stations.push({ z, desk: box(1.3, 0.8, Math.min(1.2, gap * 0.7), mats.steel, 4, 0, z), light: sphere(0.3, glow(0.3), 4, 1.5, z) });
    }
    yard = p.shared ? box(10, 0.06, 8.6, mats.dark, -4.5, 0, 0) : null;
    sim = { clock: 0, next: 0, queues: Array.from({ length: p.shared ? 1 : n }, () => []), busy: new Array(n).fill(null), done: 0, waitSum: 0 };
    sim.next = draw(1 / rate(p), p.ca);
  }
  function slot(q, i) {
    if (P.shared) { const row = Math.floor(i / 10), col = i % 10, cx = row % 2 ? col : 9 - col; return new THREE.Vector3(-9 + cx, 0.1, -3.6 + row); }
    return new THREE.Vector3(2.4 - i * 0.85, 0.1, stations[q].z);
  }
  function step(dt) {
    const end = sim.clock + dt;
    for (;;) {
      const fin = Math.min(...sim.busy.map((j) => (j ? j.finish : Infinity)));
      const tn = Math.min(sim.next, fin);
      if (tn > end) break;
      sim.clock = tn;
      if (tn === sim.next) {
        const mesh = new THREE.Mesh(crateGeo, mats.brass); mesh.castShadow = true; mesh.position.set(-16, 0.3, 0); k.scene.add(mesh);
        const c = { mesh, target: mesh.position.clone(), out: false }; crates.add(c);
        const q = P.shared ? 0 : Math.floor(Math.random() * P.engineers);
        sim.queues[q].push({ arrived: tn, crate: c });
        sim.next = tn + draw(1 / rate(P), P.ca);
      } else {
        const i = sim.busy.findIndex((j) => j && j.finish === tn);
        const j = sim.busy[i]; sim.busy[i] = null; j.crate.out = true; j.crate.target.set(16, 0.3, stations[i].z * 0.15);
      }
      dispatch();
    }
    sim.clock = end; dispatch();
  }
  function dispatch() {
    for (let i = 0; i < sim.busy.length; i++) {
      if (sim.busy[i]) continue;
      const q = P.shared ? sim.queues[0] : sim.queues[i];
      if (!q.length) continue;
      const j = q.shift();
      j.finish = sim.clock + draw(JOB, P.cs);
      sim.waitSum += sim.clock - j.arrived; sim.done++;
      j.crate.target.set(4, 0.85, stations[i].z);
      sim.busy[i] = j;
    }
  }
  k.onTick((dt) => {
    if (!sim) return;
    step(dt * 1.5); // 1.5 working days per second
    const max = P.shared ? 80 : 7;
    sim.queues.forEach((q, qi) => q.forEach((j, i) => {
      j.crate.mesh.visible = i < max;
      if (i < max) j.crate.target.copy(slot(qi, i));
    }));
    for (const c of crates) {
      c.mesh.position.lerp(c.target, Math.min(1, dt * 6));
      if (c.out && c.mesh.position.x > 15.5) { remove(c.mesh); crates.delete(c); }
    }
    sim.busy.forEach((j, i) => { stations[i].light.material.emissiveIntensity = j ? 3 : 0.25; });
    const waiting = sim.queues.reduce((s, q) => s + q.length, 0);
    k.hud.innerHTML = `<span>Day <b>${Math.floor(sim.clock)}</b></span><span>Jobs waiting <b>${waiting}</b></span><span>Done <b>${sim.done}</b></span><span>Avg wait so far <b>${sim.done ? fmt(sim.waitSum / sim.done) : "–"}</b> days</span>`;
  });
  return {
    update(p) {
      P = p;
      const s = `${p.engineers}|${p.shared}`;
      if (s !== shape) { shape = s; build(p); }
    },
  };
}

const lab = createLab({
  id: "L01",
  area: "Operations & queueing",
  title: "Kingman's law",
  goal: "Decide <b>how busy to run a team</b>, and pick the lever that cuts waiting most: hiring, pooling the work, clearer specs or taking on less.",
  story: "Your first engineering team: <b>4 engineers</b>. Requests from pilot customers arrive at random, about <b>9 a week</b>. A typical job takes <b>2 working days</b>, but sizes vary a lot. Each engineer keeps their own list of jobs.",
  params: [
    { key: "engineers", label: "Engineers", min: 1, max: 8, step: 1, value: 4, format: (v) => String(v) },
    { key: "jobs", label: "Jobs arriving per week", min: 2, max: 30, step: 0.5, value: 9, format: (v) => fmt(v, 1) },
    { key: "days", label: "Working days per week", options: [{ value: 5, label: "5 (normal)" }, { value: 5.5, label: "5.5 (overtime)" }, { value: 6, label: "6 (crunch)" }], value: 5 },
    { key: "shared", label: "How work is shared", options: [{ value: 0, label: "Own list each" }, { value: 1, label: "One shared queue" }], value: 0 },
    { key: "cs", label: "How uneven job sizes are", options: [{ value: 0.25, label: "Very even" }, { value: 0.5, label: "Clear specs" }, { value: 1, label: "Typical" }, { value: 1.5, label: "Wild" }], value: 1, hint: "Coefficient of variation of job time (cs)" },
    { key: "ca", label: "How requests arrive", options: [{ value: 0.5, label: "Planned intake" }, { value: 1, label: "Random" }, { value: 1.5, label: "Bursty" }], value: 1, hint: "Coefficient of variation of arrivals (ca)" },
  ],
  metrics: [
    { key: "busy", label: "Team busy", unit: "%", format: (v) => (Number.isFinite(v) ? v.toFixed(0) : "–") },
    { key: "wait", label: "Wait before start", unit: "days" },
    { key: "lead", label: "Customer lead time", unit: "days" },
    { key: "wip", label: "Jobs in the system", unit: "jobs" },
    { key: "slack", label: "Spare capacity", unit: "eng-days/wk" },
  ],
  model,
  chart: {
    title: "Wait vs how busy",
    xLabel: "team busy (%)", yLabel: "wait before start (days)",
    xMin: 50, xMax: 98,
    xFormat: (v) => `${Math.round(v)}%`,
    series(p) {
      measure(p);
      const curve = [];
      for (let b = 50; b <= 97.5; b += 0.5) curve.push([b, model({ ...p, jobs: (b / 100) * p.engineers * p.days / JOB }).values.wait]);
      return [
        { name: "Kingman's formula for this setup", color: "brass", points: curve },
        { name: "simulated (60,000+ jobs per dot)", color: "glow", dots: true, points: [...measured].map(([u, w]) => [u * 100, w]) },
      ];
    },
    marker: (p, r) => [r.values.busy, r.values.wait],
    note: "The dots are a separate brute-force simulation of the same floor. They sit on the curve: the formula describes what actually happens.",
  },
  stage: { floor: [34, 22], view: 21 },
  scene,
  tests: [
    {
      title: "Test 1. One move",
      situation: "Your 4 engineers are 90% busy and pilot customers complain about waiting. You can make <b>one</b> move this quarter.",
      baseline: {},
      options: [
        { id: "A", label: "Hire a fifth engineer", detail: "Same work, one more person (about €9k a month, 3 months to hire)", params: { engineers: 5 } },
        { id: "B", label: "Write clear specs", detail: "Job sizes become half as uneven", params: { cs: 0.5 } },
        { id: "C", label: "One shared queue", detail: "Whoever is free takes the next job", params: { shared: 1 } },
      ],
      rankBy: "wait", better: "lower",
      learning: "<p><b>Pooling wins, and it beats hiring.</b> With one shared queue, waiting falls about 4.5× with the same four people, because nobody sits idle while a colleague has a backlog. Hiring a fifth engineer moves everyone from 90% to 72% busy and cuts waiting about 3.5×. Clearer specs alone help least (about 1.6×).</p><p><b>Now add the cost:</b> hiring is about €9k a month and three months away. Pooling is nearly free and starts Monday. The usual instinct (more people) is the expensive answer, not the best one.</p>",
    },
    {
      title: "Test 2. No budget to hire",
      situation: "Same team, 90% busy. The board says no new hires until the next round. Pick the best plan.",
      baseline: {},
      options: [
        { id: "A", label: "Pool the work and write clear specs", detail: "One shared queue, half the unevenness", params: { shared: 1, cs: 0.5 } },
        { id: "B", label: "Overtime", detail: "Everyone works 5.5 days a week", params: { days: 5.5 } },
        { id: "C", label: "Turn away one request a week", detail: "8 jobs a week instead of 9", params: { jobs: 8 } },
      ],
      rankBy: "wait", better: "lower",
      learning: "<p><b>The two free levers together beat hiring.</b> Pooling plus clear specs cut waiting about 7×, to roughly 2.5 days, still at 90% busy and with nobody new. Overtime and saying no help about 2×: both only lower busy-ness a little.</p><p><b>The rule:</b> fix how work flows (pooling, variability) before you add capacity. Capacity is the most expensive lever and the slowest.</p>",
    },
    {
      title: "Test 3. How busy should you plan?",
      situation: "You promise pilot customers an <b>average lead time under 5 working days</b>. The team now uses one shared queue; job sizes are typical. How much work do you plan for the 4 engineers?",
      baseline: { shared: 1 },
      options: [
        { id: "A", label: "Plan 95% busy", detail: "9.5 jobs a week", params: { jobs: 9.5 } },
        { id: "B", label: "Plan 85% busy", detail: "8.5 jobs a week", params: { jobs: 8.5 } },
        { id: "C", label: "Plan 75% busy", detail: "7.5 jobs a week", params: { jobs: 7.5 } },
        { id: "D", label: "Plan 60% busy", detail: "6 jobs a week", params: { jobs: 6 } },
      ],
      rankBy: "lead", better: "lower", size: false,
      question: "Your call: the busiest plan that still keeps the 5-day promise?",
      best: (rows) => rows.filter((r) => r.v <= 5).sort((a, b) => b.p.jobs - a.p.jobs)[0].id,
      learning: "<p><b>85% is the ceiling here, and only because the work is pooled.</b> At 95% the lead time is about 11 days; at 85% about 4.3. With separate lists, even 85% gives about 13 days. Pooling is what lets a team run hotter.</p><p><b>The ideal:</b> work where speed matters runs at 70-85%. The curve bends at about 80-85%; above it, each extra point of load costs a lot of waiting, and lead times become unpredictable.</p>",
    },
  ],
  takeaways: [
    "<b>Waiting explodes with busy-ness:</b> going from 80% to 96% busy makes jobs wait about 6× longer, with the same people doing the same work.",
    "<b>The ideal is not zero waiting.</b> Balance the cost of spare capacity against the cost of delay. Where speed matters (pilots, product, a startup), plan teams at 70-85%.",
    "<b>Fix the flow before adding people:</b> pool the work, make jobs more even, limit what you start. Hiring is the most expensive lever and the slowest.",
    "<b>Little's law is the quickest check:</b> jobs in progress ÷ jobs finished per week = weeks of lead time.",
  ],
});
</script>
</body>
</html>
