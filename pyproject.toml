[project]
name = "foundry"
version = "0.1.0"
description = "The Foundry: Viktor's strategy-training game. Deterministic scoring from an append-only event log."
authors = [
    { name = "Viktor Skovbak" }
]
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
foundry = "foundry.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
# Never pick up the Windows Store python.exe stubs; use uv-managed interpreters only.
python-preference = "only-managed"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
