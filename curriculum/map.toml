# The Foundry curriculum map: tracks, areas, phases and the machine part each area builds.
# `phase` is the default teaching order (1 = first). `plot` is the part's place on the
# isometric floor (column, row); the strategy core sits at the centre (0, 0).
# `part` picks the renderer's model in web/machine.js.

[[track]]
id = "strategy_core"
name = "Strategy core"

[[track]]
id = "economics"
name = "Business economics"

[[track]]
id = "venture"
name = "Venture"

[[track]]
id = "ops_systems"
name = "Operations & systems"

[[track]]
id = "people"
name = "People & organisation"

[[track]]
id = "judgement"
name = "Judgement"

# --- Strategy core -------------------------------------------------------------
[[area]]
id = "strategy"
name = "Business strategy"
track = "strategy_core"
phase = 2
part = "core"
part_name = "Strategy core"
plot = [0, 0]
spine = "Rumelt, Porter, Helmer, Christensen"

[[area]]
id = "competition"
name = "Competitive dynamics & game theory"
track = "strategy_core"
phase = 2
part = "walls"
part_name = "Moat walls"
plot = [-1, -1]
spine = "Porter, Helmer, Brandenburger & Nalebuff, Schelling"

[[area]]
id = "growth"
name = "Growth strategy"
track = "strategy_core"
phase = 2
part = "piston"
part_name = "Growth piston"
plot = [-2, -1]
spine = "Ansoff, Christensen, Bass diffusion, network effects"

# --- Business economics --------------------------------------------------------
[[area]]
id = "anatomy"
name = "Business anatomy"
track = "economics"
phase = 2
part = "assay"
part_name = "Assay office"
plot = [0, -1]
spine = "P&L, balance sheet, cash conversion, value chain"

[[area]]
id = "unit_econ"
name = "Unit economics & cost curves"
track = "economics"
phase = 1
part = "furnace"
part_name = "Furnace"
plot = [1, -1]
spine = "Wright's law, contribution margin, target cost"

[[area]]
id = "pricing"
name = "Pricing"
track = "economics"
phase = 2
part = "press"
part_name = "Pricing press"
plot = [2, -2]
spine = "Value-based pricing, price discrimination, Ramanujam"

[[area]]
id = "capital"
name = "Capital allocation & corporate finance"
track = "economics"
phase = 2
part = "vault"
part_name = "Vault"
plot = [1, -2]
spine = "Thorndike, Buffett letters, ROIC vs WACC, Modigliani-Miller"

